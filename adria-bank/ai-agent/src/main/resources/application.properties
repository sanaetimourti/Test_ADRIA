spring.application.name=ai-agent
server.port=8085
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.sse.connections.account.url=http://localhost:8081
spring.ai.mcp.client.sse.connections.transaction.url=http://localhost:8082
management.endpoints.web.exposure.include=health,info
